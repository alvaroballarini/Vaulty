name: Process Recurring Transactions

on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/10 * * * *" # Ajustado a 10 min según tu requerimiento original
  workflow_dispatch:

jobs:
  process-recurring-transactions:
    runs-on: ubuntu-latest

    steps:
      - name: Test
        run: echo "GitHub Action ejecutada correctamente Test"

      - name: Call API
        run: |
          curl --fail-with-body -X GET \
            "https://vaultytest.vercel.app/api/cron/recurring-transactions" \
            -H "Authorization: Bearer $CRON_SECRET"
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
